{% extends "base.html" %}
{% block title %}{{ title }} — book-reader{% endblock %}
{% block body %}
<div class="toolbar">
  <a href="/">← library</a>
  <span class="title">{{ title }}</span>
</div>
{% if error %}
<p class="error">{{ error }}</p>
{% else %}
<article class="md">{{ html|safe }}</article>
<button id="note-capture" class="bubble" type="button" hidden>+ Note</button>
{% endif %}
{% endblock %}
{% block scripts %}
{% if not error %}
<script>
const REL = {{ rel|tojson }};
const restore = {{ (progress.scroll if progress.scroll is not none else 0.0)|tojson }};
const article = document.querySelector('article.md');
const bubble = document.getElementById('note-capture');
let pendingCapture = null;

function scrolledRatio() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  return max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
}

if (restore > 0) {
  requestAnimationFrame(() => {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    if (max > 0) window.scrollTo(0, restore * max);
  });
}

let scrollTimer = null;
window.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    fetch('/api/progress', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ path: REL, scroll: scrolledRatio() }),
    }).catch(() => {});
  }, 400);
}, { passive: true });

function sectionPath(node) {
  const headings = Array.from(article.querySelectorAll('h1, h2, h3, h4')).filter(
    (heading) => heading.compareDocumentPosition(node) & Node.DOCUMENT_POSITION_FOLLOWING,
  );
  return headings
    .slice(-2)
    .map((heading) => heading.textContent.trim())
    .join(' › ');
}

function paragraphIndex(node) {
  const blocks = Array.from(article.querySelectorAll('p, li, pre, table, blockquote'));
  const element = node.nodeType === 1 ? node : node.parentElement;
  const block = element && element.closest('p, li, pre, table, blockquote');
  const index = block ? blocks.indexOf(block) : -1;
  return index >= 0 ? index + 1 : null;
}

document.addEventListener('mouseup', () => {
  const selection = window.getSelection();
  if (!selection || selection.isCollapsed || !selection.rangeCount) {
    bubble.hidden = true;
    pendingCapture = null;
    return;
  }
  const range = selection.getRangeAt(0);
  if (!article.contains(range.commonAncestorContainer)) {
    bubble.hidden = true;
    pendingCapture = null;
    return;
  }
  const quote = selection.toString().trim();
  if (!quote) {
    bubble.hidden = true;
    pendingCapture = null;
    return;
  }
  const rect = range.getBoundingClientRect();
  pendingCapture = {
    book: REL,
    kind: 'md',
    quote: quote,
    section: sectionPath(range.commonAncestorContainer),
    paragraph: paragraphIndex(range.commonAncestorContainer),
  };
  bubble.hidden = false;
  bubble.style.left = Math.max(8, rect.left) + 'px';
  bubble.style.top = Math.max(48, rect.top - 34) + 'px';
});

bubble.addEventListener('click', () => {
  if (pendingCapture && window.Notepad) window.Notepad.compose(pendingCapture);
  bubble.hidden = true;
  pendingCapture = null;
});
</script>
{% endif %}
{% endblock %}
