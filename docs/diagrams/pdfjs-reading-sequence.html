<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading a page, keeping a passage · book-reader sequence</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #F6F1E4;
      --paper-2: #FFFDF6;
      --ink: #241E16;
      --muted: #6B5D4A;
      --soft: #8A7A63;
      --rule: rgba(36, 30, 22, 0.12);
      --accent: #B08A4A;
      --accent-tint: rgba(176, 138, 74, 0.12);
      --link: #7E5F2E;
      --serif: "Source Serif 4", "Iowan Old Style", Palatino, Georgia, serif;
      --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 24px;
    }
    .frame { width: 100%; max-width: 1120px; }
    .eyebrow {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.25rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
      max-width: 58ch;
      margin-bottom: 28px;
    }
    .diagram { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; height: auto; }
    @media (max-width: 700px) {
      body { padding: 28px 16px; }
      .subtitle { margin-bottom: 20px; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sequence · book-reader</p>
    <h1>A page turn and a passage</h1>
    <p class="subtitle">Page progress is a fast event; a note is the durable result. The bridge keeps the native PDF.js viewer and the local state store in step.</p>

    <div class="diagram">
      <svg viewBox="0 0 1120 620" role="img" aria-labelledby="seq-title seq-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="seq-title">Reading a page and saving a passage</title>
        <desc id="seq-desc">Reader, PDF.js viewer, pdf_reader bridge, FastAPI routes, and local stores exchange page changes and a selected passage over time.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#6B5D4A"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#7E5F2E"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#B08A4A"/>
          </marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#6B5D4A" stroke-width="1.2"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#F6F1E4"/>

        <!-- Lifelines: Reader 128, Bridge 344, PDF.js 560, FastAPI 776, Stores 992 -->
        <line x1="128" y1="120" x2="128" y2="536" stroke="rgba(36,30,22,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="344" y1="120" x2="344" y2="536" stroke="rgba(36,30,22,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="560" y1="120" x2="560" y2="536" stroke="rgba(36,30,22,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="776" y1="120" x2="776" y2="536" stroke="rgba(36,30,22,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="992" y1="120" x2="992" y2="536" stroke="rgba(36,30,22,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation bars: control intervals -->
        <rect x="556" y="156" width="8" height="248" fill="rgba(36,30,22,0.05)" stroke="#6B5D4A" stroke-width="0.8"/>
        <rect x="340" y="188" width="8" height="232" fill="rgba(176,138,74,0.10)" stroke="#B08A4A" stroke-width="0.8"/>
        <rect x="772" y="220" width="8" height="300" fill="rgba(36,30,22,0.05)" stroke="#6B5D4A" stroke-width="0.8"/>
        <rect x="988" y="252" width="8" height="232" fill="rgba(36,30,22,0.05)" stroke="#6B5D4A" stroke-width="0.8"/>

        <!-- Messages: top to bottom is time -->
        <line x1="128" y1="160" x2="560" y2="160" stroke="#6B5D4A" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="560" y1="192" x2="344" y2="192" stroke="#6B5D4A" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <line x1="344" y1="224" x2="776" y2="224" stroke="#7E5F2E" stroke-width="1.3" marker-end="url(#arrow-link)"/>
        <line x1="776" y1="256" x2="992" y2="256" stroke="#6B5D4A" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="992" y1="288" x2="776" y2="288" stroke="#6B5D4A" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="776" y1="320" x2="344" y2="320" stroke="#6B5D4A" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="128" y1="352" x2="560" y2="352" stroke="#6B5D4A" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="560" y1="384" x2="344" y2="384" stroke="#6B5D4A" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="344" y1="416" x2="128" y2="416" stroke="#6B5D4A" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="128" y1="448" x2="776" y2="448" stroke="#7E5F2E" stroke-width="1.3" marker-end="url(#arrow-link)"/>
        <line x1="776" y1="480" x2="992" y2="480" stroke="#6B5D4A" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="776" y1="512" x2="128" y2="512" stroke="#B08A4A" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

        <!-- Message labels: opaque masks leave a 9px gap above each stroke -->
        <rect x="292" y="140" width="104" height="12" rx="2" fill="#F6F1E4"/>
        <text x="344" y="148" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">TURN TO PAGE 11</text>

        <rect x="392" y="172" width="120" height="12" rx="2" fill="#F6F1E4"/>
        <text x="452" y="180" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">PAGECHANGING(11)</text>

        <rect x="492" y="204" width="136" height="12" rx="2" fill="#F6F1E4"/>
        <text x="560" y="212" fill="#7E5F2E" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">POST /API/PROGRESS</text>

        <rect x="836" y="236" width="96" height="12" rx="2" fill="#F6F1E4"/>
        <text x="884" y="244" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE PROGRESS</text>

        <rect x="864" y="268" width="40" height="12" rx="2" fill="#F6F1E4"/>
        <text x="884" y="276" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">OK</text>

        <rect x="540" y="300" width="40" height="12" rx="2" fill="#F6F1E4"/>
        <text x="560" y="308" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">200</text>

        <rect x="296" y="332" width="96" height="12" rx="2" fill="#F6F1E4"/>
        <text x="344" y="340" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SELECT PASSAGE</text>

        <rect x="400" y="364" width="104" height="12" rx="2" fill="#F6F1E4"/>
        <text x="452" y="372" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">PAGE 11 · QUOTE</text>

        <rect x="208" y="396" width="56" height="12" rx="2" fill="#F6F1E4"/>
        <text x="236" y="404" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">+ NOTE</text>

        <rect x="376" y="428" width="152" height="12" rx="2" fill="#F6F1E4"/>
        <text x="452" y="436" fill="#7E5F2E" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">POST /API/NOTEPAD/NOTES</text>

        <rect x="824" y="460" width="120" height="12" rx="2" fill="#F6F1E4"/>
        <text x="884" y="468" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">APPEND · CHAR SPAN</text>

        <rect x="396" y="492" width="112" height="12" rx="2" fill="#F6F1E4"/>
        <text x="452" y="500" fill="#B08A4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">201 · NOTE SAVED</text>

        <!-- Actor boxes: Reader, Bridge (focal), PDF.js, FastAPI, Stores -->
        <rect x="48" y="64" width="160" height="56" rx="6" fill="#F6F1E4"/>
        <rect x="48" y="64" width="160" height="56" rx="6" fill="rgba(107,93,74,0.10)" stroke="#8A7A63" stroke-width="1"/>
        <rect x="56" y="72" width="24" height="12" rx="2" fill="transparent" stroke="rgba(138,122,99,0.45)" stroke-width="0.8"/>
        <text x="68" y="80" fill="#8A7A63" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="128" y="104" fill="#241E16" font-size="12" font-weight="600" font-family="'Public Sans', system-ui, sans-serif" text-anchor="middle">Reader</text>
        <text x="128" y="116" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">browser</text>

        <rect x="264" y="64" width="160" height="56" rx="6" fill="#F6F1E4"/>
        <rect x="264" y="64" width="160" height="56" rx="6" fill="rgba(176,138,74,0.12)" stroke="#B08A4A" stroke-width="1.2"/>
        <rect x="272" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(176,138,74,0.55)" stroke-width="0.8"/>
        <text x="288" y="80" fill="#B08A4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
        <text x="344" y="104" fill="#241E16" font-size="12" font-weight="600" font-family="'Public Sans', system-ui, sans-serif" text-anchor="middle">Bridge</text>
        <text x="344" y="116" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">usePdfBridge</text>

        <rect x="480" y="64" width="160" height="56" rx="6" fill="#F6F1E4"/>
        <rect x="480" y="64" width="160" height="56" rx="6" fill="#FFFDF6" stroke="#241E16" stroke-width="1"/>
        <rect x="488" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(36,30,22,0.35)" stroke-width="0.8"/>
        <text x="504" y="80" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">PDF</text>
        <text x="560" y="104" fill="#241E16" font-size="12" font-weight="600" font-family="'Public Sans', system-ui, sans-serif" text-anchor="middle">PDF.js viewer</text>
        <text x="560" y="116" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">iframe · 6.5.438</text>

        <rect x="696" y="64" width="160" height="56" rx="6" fill="#F6F1E4"/>
        <rect x="696" y="64" width="160" height="56" rx="6" fill="#FFFDF6" stroke="#241E16" stroke-width="1"/>
        <rect x="704" y="72" width="24" height="12" rx="2" fill="transparent" stroke="rgba(36,30,22,0.35)" stroke-width="0.8"/>
        <text x="716" y="80" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="776" y="104" fill="#241E16" font-size="12" font-weight="600" font-family="'Public Sans', system-ui, sans-serif" text-anchor="middle">FastAPI</text>
        <text x="776" y="116" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">progress · notes</text>

        <rect x="912" y="64" width="160" height="56" rx="6" fill="#F6F1E4"/>
        <rect x="912" y="64" width="160" height="56" rx="6" fill="rgba(36,30,22,0.05)" stroke="#6B5D4A" stroke-width="1"/>
        <rect x="920" y="72" width="24" height="12" rx="2" fill="transparent" stroke="rgba(107,93,74,0.35)" stroke-width="0.8"/>
        <text x="932" y="80" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="992" y="104" fill="#241E16" font-size="12" font-weight="600" font-family="'Public Sans', system-ui, sans-serif" text-anchor="middle">Local state</text>
        <text x="992" y="116" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">JSON stores</text>

        <!-- Legend: separate strip below the lifelines -->
        <line x1="48" y1="560" x2="1072" y2="560" stroke="rgba(36,30,22,0.12)" stroke-width="0.8"/>
        <text x="48" y="580" fill="#6B5D4A" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="48" y="588" width="14" height="12" rx="2" fill="rgba(176,138,74,0.12)" stroke="#B08A4A" stroke-width="1"/>
        <text x="72" y="600" fill="#6B5D4A" font-size="12" font-family="'Public Sans', system-ui, sans-serif">Focal bridge</text>

        <line x1="196" y1="596" x2="224" y2="596" stroke="#7E5F2E" stroke-width="1.3" marker-end="url(#arrow-link)"/>
        <text x="232" y="600" fill="#6B5D4A" font-size="12" font-family="'Public Sans', system-ui, sans-serif">HTTP call</text>

        <line x1="356" y1="596" x2="384" y2="596" stroke="#6B5D4A" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="392" y="600" fill="#6B5D4A" font-size="12" font-family="'Public Sans', system-ui, sans-serif">Event / return</text>

        <line x1="536" y1="596" x2="564" y2="596" stroke="#B08A4A" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <text x="572" y="600" fill="#6B5D4A" font-size="12" font-family="'Public Sans', system-ui, sans-serif">Saved note</text>
      </svg>
    </div>
  </main>
</body>
</html>
